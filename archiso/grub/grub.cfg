# LinkSOS GRUB Configuration
# Boot menu entries for the live ISO

set default=0
set timeout=15
set pager=1

# Theme
if loadfont /boot/grub/fonts/unicode.pf2 ; then
    set gfxmode=auto
    set gfxpayload=keep
    insmod all_video
    insmod gfxterm
    insmod png
    insmod progress
    terminal_input console
    terminal_output gfxterm
fi

# Background colors (GitHub Dark theme)
set color_normal=c9d1d9/0d1117
set color_highlight=58a6ff/161b22

menuentry "LinkSOS Linux (Live)" {
    load_video
    set gfxpayload=keep
    insmod gzio
    insmod part_msdos
    insmod ext2
    linux /arch/boot/x86_64/vmlinuz-linux-zen archisobasedir=arch archisolabel=LINKSOS_%Y%m quiet splash loglevel=3 rd.systemd.show_status=auto rd.udev.log_level=3 mitigations=off nowatchdog nvidia-drm.modeset=1
    initrd /arch/boot/x86_64/initramfs-linux-zen.img
}

menuentry "LinkSOS Linux (Live - NVIDIA)" {
    load_video
    set gfxpayload=keep
    insmod gzio
    insmod part_msdos
    insmod ext2
    linux /arch/boot/x86_64/vmlinuz-linux-zen archisobasedir=arch archisolabel=LINKSOS_%Y%m quiet splash loglevel=3 rd.systemd.show_status=auto rd.udev.log_level=3 mitigations=off nowatchdog nvidia-drm.modeset=1 nvidia nvidia_modeset nvidia_uvm nvidia_drm
    initrd /arch/boot/x86_64/initramfs-linux-zen.img
}

menuentry "LinkSOS Linux (Live - Verbose)" {
    load_video
    set gfxpayload=keep
    insmod gzio
    insmod part_msdos
    insmod ext2
    linux /arch/boot/x86_64/vmlinuz-linux-zen archisobasedir=arch archisolabel=LINKSOS_%Y%m loglevel=7
    initrd /arch/boot/x86_64/initramfs-linux-zen.img
}

menuentry "LinkSOS Linux (Safe Mode)" {
    load_video
    set gfxpayload=keep
    insmod gzio
    insmod part_msdos
    insmod ext2
    linux /arch/boot/x86_64/vmlinuz-linux-zen archisobasedir=arch archisolabel=LINKSOS_%Y%m nomodeset
    initrd /arch/boot/x86_64/initramfs-linux-zen.img
}

menuentry "Reboot" {
    reboot
}

menuentry "Shutdown" {
    halt
}
