#
# /etc/pacman.conf - LinkSOS Build Pacman Configuration
# Used by archiso to install packages into the airootfs chroot
#

[options]
HoldPkg           = pacman glibc
Architecture      = auto
CheckSpace
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 10

# === CORE REPOSITORIES ===
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# === MULTILIB (required for Wine/gaming 32-bit libs) ===
[multilib]
Include = /etc/pacman.d/mirrorlist

# === ARCH LINUX CN (yay, brave-bin, extra gaming tools) ===
# SigLevel = Optional TrustAll allows unsigned packages during build
# On the installed system, the post-install script will set proper SigLevel
[archlinuxcn]
Server = https://repo.archlinuxcn.org/$arch
SigLevel = Optional TrustAll
