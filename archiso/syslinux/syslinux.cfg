# LinkSOS Syslinux Configuration (BIOS Boot)
# Boot menu for legacy BIOS systems

DEFAULT linksos
PROMPT 0
TIMEOUT 150
ALLOWOPTIONS 1

# Theme
MENU TITLE LinkSOS Linux
MENU COLOR title        1;36;40 #58a6ff #0d1117
MENU COLOR border       30;40   #30363d #0d1117
MENU COLOR sel          7;37;40 #58a6ff #161b22
MENU COLOR unsel        37;40   #8b949e #0d1117
MENU COLOR help         37;40   #c9d1d9 #0d1117
MENU COLOR timeout_msg  37;40   #c9d1d9 #0d1117
MENU COLOR timeout      1;37;40 #58a6ff #0d1117
MENU COLOR msg07        37;40   #c9d1d9 #0d1117

LABEL linksos
    MENU LABEL LinkSOS Linux (Live)
    LINUX /arch/boot/x86_64/vmlinuz-linux-zen
    INITRD /arch/boot/x86_64/initramfs-linux-zen.img
    APPEND archisobasedir=arch archisolabel=LINKSOS_%Y%m quiet splash loglevel=3 rd.systemd.show_status=auto rd.udev.log_level=3 mitigations=off nowatchdog nvidia-drm.modeset=1

LABEL linksos-nvidia
    MENU LABEL LinkSOS Linux (Live - NVIDIA)
    LINUX /arch/boot/x86_64/vmlinuz-linux-zen
    INITRD /arch/boot/x86_64/initramfs-linux-zen.img
    APPEND archisobasedir=arch archisolabel=LINKSOS_%Y%m quiet splash loglevel=3 nvidia-drm.modeset=1 nvidia nvidia_modeset nvidia_uvm nvidia_drm

LABEL linksos-verbose
    MENU LABEL LinkSOS Linux (Live - Verbose)
    LINUX /arch/boot/x86_64/vmlinuz-linux-zen
    INITRD /arch/boot/x86_64/initramfs-linux-zen.img
    APPEND archisobasedir=arch archisolabel=LINKSOS_%Y%m loglevel=7

LABEL linksos-safe
    MENU LABEL LinkSOS Linux (Safe Mode)
    LINUX /arch/boot/x86_64/vmlinuz-linux-zen
    INITRD /arch/boot/x86_64/initramfs-linux-zen.img
    APPEND archisobasedir=arch archisolabel=LINKSOS_%Y%m nomodeset

LABEL reboot
    MENU LABEL Reboot
    COM32 reboot.c32

LABEL poweroff
    MENU LABEL Shutdown
    COM32 poweroff.c32
