# LinkSOS systemd-boot Configuration (UEFI)
# Boot entries for UEFI systems

title   LinkSOS Linux (Live)
linux   /arch/boot/x86_64/vmlinuz-linux-zen
initrd  /arch/boot/x86_64/initramfs-linux-zen.img
options archisobasedir=arch archisolabel=LINKSOS_%Y%m quiet splash loglevel=3 rd.systemd.show_status=auto rd.udev.log_level=3 mitigations=off nowatchdog nvidia-drm.modeset=1
