name: Build LinkSOS ISO

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g., 2026.07)'
        required: false
        default: 'nightly'
      build_profile:
        description: 'Build profile (full or minimal)'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - minimal

env:
  ISO_NAME: linksos
  ARCHISO_PROFILE: archiso

permissions:
  contents: write

jobs:
  build-iso:
    name: Build LinkSOS ISO
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: archlinux:latest
      options: --privileged
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Initialize Arch Linux environment
        run: |
          echo "==> Initializing Arch Linux build environment..."
          
          # Step 1: Full system update
          pacman -Syu --noconfirm
          
          # Step 2: Add archlinuxcn repo BEFORE installing its keyring
          # The keyring lives inside the archlinuxcn repo, so we must
          # add the repo first with TrustAll to bootstrap it
          echo "==> Adding archlinuxcn repository..."
          cat >> /etc/pacman.conf << 'REPOEOF'
          [archlinuxcn]
          Server = https://repo.archlinuxcn.org/$arch
          SigLevel = Optional TrustAll
          REPOEOF
          
          # Step 3: Sync all repos (including the newly added archlinuxcn)
          pacman -Sy --noconfirm
          
          # Step 4: Initialize pacman keyring
          pacman-key --init
          pacman-key --populate archlinux
          
          # Step 5: Install archlinuxcn keyring (now available from the repo)
          pacman -S --noconfirm --needed archlinuxcn-keyring || {
            echo "==> archlinuxcn-keyring not available, downloading directly..."
            curl -L "https://raw.githubusercontent.com/archlinuxcn/archlinuxcn-keyring/master/archlinuxcn-keyring.pkg.tar.zst" -o /tmp/cn-keyring.pkg.tar.zst
            pacman -U --noconfirm /tmp/cn-keyring.pkg.tar.zst || true
          }
          
          # Step 6: Install build tools (all from official Arch repos)
          pacman -S --noconfirm --needed \
            base-devel \
            archiso \
            squashfs-tools \
            git \
            curl \
            wget \
            reflector \
            7zip \
            unzip \
            dosfstools \
            mtools \
            xorriso \
            grub \
            syslinux \
            edk2-shell \
            imagemagick \
            python \
            jq
          
          # Step 7: Update mirror list for faster downloads
          reflector --country "US,DE,FR,GB,NL" --latest 20 --sort rate --save /etc/pacman.d/mirrorlist
          
          echo "==> Build environment ready!"

      - name: Verify archiso and profile
        run: |
          echo "==> Verifying build tools..."
          
          # Check archiso version
          pacman -Q archiso || { echo "ERROR: archiso not installed!"; exit 1; }
          
          PROFILE_DIR="${GITHUB_WORKSPACE}/${{ env.ARCHISO_PROFILE }}"
          
          # Verify profile structure
          for f in profiledef.sh packages.x86_64 pacman.conf; do
            if [ ! -f "${PROFILE_DIR}/${f}" ]; then
              echo "ERROR: ${f} not found in profile directory!"
              exit 1
            fi
          done
          
          # Validate and make scripts executable
          if [ -f "${PROFILE_DIR}/customize_airootfs.sh" ]; then
            chmod +x "${PROFILE_DIR}/customize_airootfs.sh"
            echo "==> customize_airootfs.sh validated"
          fi
          
          # Quick-check package names against repos
          echo "==> Quick-checking package availability..."
          PKG_FILE="${PROFILE_DIR}/packages.x86_64"
          MISSING=""
          while IFS= read -r pkg; do
            # Skip comments and empty lines
            pkg=$(echo "$pkg" | sed 's/#.*//' | xargs)
            [ -z "$pkg" ] && continue
            if ! pacman -Si "$pkg" > /dev/null 2>&1; then
              MISSING="${MISSING} ${pkg}"
            fi
          done < "${PKG_FILE}"
          
          if [ -n "${MISSING}" ]; then
            echo "WARNING: These packages not found in repos: ${MISSING}"
            echo "They may be from archlinuxcn or AUR and will be handled during build."
          fi
          
          echo "==> Profile validated!"

      - name: Build ISO
        run: |
          echo "==> Starting ISO build..."
          
          WORK_DIR="/tmp/archiso-work"
          PROFILE_DIR="${GITHUB_WORKSPACE}/${{ env.ARCHISO_PROFILE }}"
          OUT_DIR="${GITHUB_WORKSPACE}/out"
          
          mkdir -p "${WORK_DIR}" "${OUT_DIR}"
          
          # Run mkarchiso with verbose output
          # This handles: chroot setup → package install → customization → squashfs → ISO
          mkarchiso -v -w "${WORK_DIR}" -o "${OUT_DIR}" "${PROFILE_DIR}"
          
          echo "==> ISO build complete!"

      - name: Verify and checksum ISO
        run: |
          OUT_DIR="${GITHUB_WORKSPACE}/out"
          
          ISO_FILE=$(find "${OUT_DIR}" -name "*.iso" -type f | head -1)
          if [ -z "${ISO_FILE}" ]; then
            echo "ERROR: No ISO file found!"
            ls -la "${OUT_DIR}/"
            exit 1
          fi
          
          ISO_SIZE=$(du -h "${ISO_FILE}" | cut -f1)
          echo "==> ISO: ${ISO_FILE}"
          echo "==> Size: ${ISO_SIZE}"
          
          # Generate checksums
          sha256sum "${ISO_FILE}" > "${ISO_FILE}.sha256sum"
          md5sum "${ISO_FILE}" > "${ISO_FILE}.md5sum"
          cat "${ISO_FILE}.sha256sum"
          
          # Build info
          cat > "${OUT_DIR}/build-info.txt" << EOF
          Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Version: ${{ github.event.inputs.version_tag || 'nightly' }}
          Profile: ${{ github.event.inputs.build_profile || 'full' }}
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          ISO Size: ${ISO_SIZE}
          EOF

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: linksos-iso
          path: |
            out/*.iso
            out/*.iso.sha256sum
            out/*.iso.md5sum
            out/build-info.txt
          retention-days: 5
          compression-level: 0

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event.inputs.version_tag != 'nightly'
        with:
          tag_name: ${{ github.event.inputs.version_tag || format('v{0}', github.run_number) }}
          name: "LinkSOS Linux ${{ github.event.inputs.version_tag || format('v{0}', github.run_number) }}"
          body: |
            ## LinkSOS Linux Release
            
            **Commit:** ${{ github.sha }}
            
            ### System Specifications
            - **Desktop:** Hyprland (Wayland) + Waybar (Windows 11-style taskbar)
            - **Base:** Arch Linux with linux-zen kernel
            - **Idle RAM:** ~120-150 MB
            - **Installer:** Calamares (one-click graphical installer)
            - **Gaming:** Wine + Proton + Lutris + Steam (installed via first-run wizard after disk install)
            
            ### Download
            
            Download the ISO from the assets below, or from the [Actions artifact](https://github.com/salom600/linksos/actions) if the release doesn't include it.
            
            ### Flash to USB
            
            **Windows:** Use [Rufus](https://rufus.ie)
            
            **Linux/macOS:**
            ```bash
            dd bs=4M if=linksos-*.iso of=/dev/sdX status=progress && sync
            ```
            
            ### Post-Install
            
            After installing LinkSOS to disk, the **first-run wizard** will automatically:
            - Detect your GPU (NVIDIA / AMD / Intel) and install drivers
            - Install the full gaming stack (Steam, Lutris, Wine-mono/gecko, MangoHud, GameMode)
            - Install additional utilities (media apps, printing, CJK fonts)
            
            You can re-run gaming setup anytime: `linksos-setup-gaming`
            
            ### SHA256 Checksum
            See the `.sha256sum` file for verification.
          files: |
            out/*.iso
            out/*.iso.sha256sum
            out/*.iso.md5sum
            out/build-info.txt
          draft: false
          prerelease: ${{ github.event.inputs.version_tag == 'nightly' }}

      - name: Cleanup
        if: always()
        run: |
          rm -rf /tmp/archiso-work 2>/dev/null || true
          echo "==> Cleanup done!"
